# nginx proxy address - http://172.17.0.1:64201

name: homepage
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: homepage-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      HOMEPAGE_ALLOWED_HOSTS: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider -Y off http://127.0.0.1:$$PORT/api/healthcheck || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64201:3000'
    volumes:
      - './volumes/config/homepage:/app/config:z'
    networks:
      - homepage

networks:
  homepage:
    name: homepage
    external: false
